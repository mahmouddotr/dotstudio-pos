<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DotStudio® POS · Sign in</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="assets/img/LOGO-ICON-DONE.png">
  <link rel="stylesheet" href="shared/css/design-system.css">
  <link rel="stylesheet" href="shared/css/components.css">
  <link rel="stylesheet" href="shared/css/app.css">
  <script src="shared/js/i18n.js"></script>
  <style>
    :root { --apple-blue:#007AFF; --apple-lime:#82FF1F; --ink:#0b0b0d; --muted:#77777f; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; background:#000; }
    body { min-height:100svh; overflow-x:hidden; }
    .intro { position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:#000; animation:introOut .55s ease 1.95s forwards; pointer-events:none; }
    .intro-logo { width:auto; height:52px; opacity:0; filter:drop-shadow(0 0 24px rgba(255,255,255,.16)); animation:logoIn .95s cubic-bezier(.22,.8,.25,1) .22s forwards; }
    .intro-mark { position:absolute; width:170px; height:170px; border:1px solid rgba(255,255,255,.12); border-radius:50%; animation:halo 1.8s ease .25s forwards; }
    @keyframes logoIn { from { opacity:0; transform:translateY(14px) scale(.96); } to { opacity:1; transform:none; } }
    @keyframes halo { from { opacity:0; transform:scale(.72); } 45% { opacity:1; } to { opacity:0; transform:scale(1.28); } }
    @keyframes introOut { to { opacity:0; visibility:hidden; } }
    .login-page { min-height:100svh; display:grid; grid-template-columns:55% 45%; direction:ltr; background:#000; }
    .brand-side { position:relative; min-height:100svh; overflow:hidden; color:var(--ink); background:#fff; }
    .brand-side::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 18% 16%, rgba(0,122,255,.055), transparent 28%), linear-gradient(145deg,#fff 0%,#fafafa 60%,#f2f2f2 100%); }
    .brand-top { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:34px 44px; }
    .brand-top img { height:40px !important; width:auto !important; max-width:180px; object-fit:contain; }
    .brand-pill { padding:8px 13px; border:1px solid rgba(0,0,0,.1); border-radius:980px; color:#66666d; font:700 10px/1 var(--font-body,Arial,sans-serif); letter-spacing:.15em; text-transform:uppercase; }
    .brand-copy { position:relative; z-index:2; max-width:650px; padding:clamp(100px,16vh,190px) 44px 0; }
    .brand-kicker { display:inline-block; color:var(--apple-blue); font:700 11px/1 var(--font-body,Arial,sans-serif); letter-spacing:.18em; text-transform:uppercase; }
    .brand-copy h1 { max-width:610px; margin:22px 0 16px; color:#08080a; font:700 clamp(52px,6.4vw,96px)/.94 var(--font-display,-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif); letter-spacing:-.075em; }
    .brand-copy p { max-width:430px; margin:0; color:#696970; font:400 16px/1.7 var(--font-body,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif); }
    .silhouette { position:absolute; z-index:1; right:-5%; bottom:-3%; width:78%; max-width:820px; height:74%; object-fit:contain; object-position:right bottom; mix-blend-mode:multiply; filter:contrast(1.04) saturate(.72); }
    .brand-foot { position:absolute; z-index:2; inset:auto 44px 28px; display:flex; justify-content:space-between; color:#99999f; font:600 10px/1 var(--font-body,Arial,sans-serif); letter-spacing:.12em; text-transform:uppercase; }
    .form-side { display:flex; align-items:center; justify-content:center; min-height:100svh; padding:48px clamp(24px,6vw,92px); direction:rtl; background:#000; }
    html[dir="ltr"] .form-side { direction:ltr; }
    .form-wrap { width:min(100%,390px); }
    .panel-logo { display:none; height:40px !important; width:auto !important; margin:0 0 34px; }
    .glass-card { padding:38px 34px 32px; border:1px solid rgba(255,255,255,.11); border-radius:24px; background:rgba(20,20,22,.7); -webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px); box-shadow:0 24px 90px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.05); }
    .login-heading { margin-bottom:28px; }
    .login-heading h2 { margin:0 0 9px; color:#fff; font:650 clamp(30px,3vw,40px)/1.05 var(--font-display,-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif); letter-spacing:-.055em; }
    .login-heading p { margin:0; color:#8d8d95; font:400 13px/1.65 var(--font-body,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif); }
    .login-field { display:flex; flex-direction:column; gap:8px; margin-bottom:17px; }
    .login-field label { color:#a1a1aa; font:600 12px/1 var(--font-body,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif); }
    .login-field .input { min-height:52px; padding:0 15px; border:1px solid rgba(255,255,255,.12); border-radius:12px; outline:0; color:#fff; background:rgba(255,255,255,.055); transition:border-color .2s ease,box-shadow .2s ease,background .2s ease; }
    .login-field .input:focus { border-color:var(--apple-blue); background:rgba(255,255,255,.08); box-shadow:0 0 0 4px rgba(0,122,255,.22); }
    .login-password { position:relative; }
    .login-password .input { width:100%; padding-inline-end:48px; }
    .login-password button { position:absolute; inset-inline-end:6px; top:6px; display:grid; place-items:center; width:40px; height:40px; border:0; border-radius:10px; color:#8e8e96; background:transparent; cursor:pointer; }
    .login-password button:hover { color:#fff; background:rgba(255,255,255,.08); }
    .login-password svg { width:18px; height:18px; }
    .login-options { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:5px 0 22px; color:#92929a; font:400 11px/1 var(--font-body,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif); }
    .login-options label { display:inline-flex; align-items:center; gap:7px; }
    .login-options input { accent-color:var(--apple-blue); }
    .login-options a { color:#7cbaff; font-weight:600; text-decoration:none; }
    .login-options a:hover { color:#fff; }
    .login-error { display:none; margin:0 0 14px; padding:11px 13px; border:1px solid rgba(255,90,80,.55); border-radius:12px; color:#ff8e86; background:rgba(255,80,70,.1); font-size:12px; }
    .login-error.show { display:block; }
    .login-submit { width:100%; min-height:52px; border:0; border-radius:980px !important; color:#fff; background:var(--apple-blue); box-shadow:0 10px 24px rgba(0,122,255,.22); font:650 14px/1 var(--font-body,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif); transition:transform .2s ease,filter .2s ease,box-shadow .2s ease; }
    .login-submit:hover { filter:brightness(1.08); box-shadow:0 13px 30px rgba(0,122,255,.3); transform:translateY(-1px); }
    .login-submit:active { transform:translateY(0) scale(.99); }
    .login-note { margin-top:22px; padding-top:18px; border-top:1px solid rgba(255,255,255,.1); color:#66666e; font:400 10px/1.8 var(--font-body,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif); text-align:center; }
    .login-note a { color:#9a9aa3; text-decoration:none; }
    .session-banner { margin-bottom:18px; }
    .session-banner:empty { display:none; }
    .session-banner .banner { display:flex; align-items:center; gap:9px; padding:10px; border:1px solid rgba(255,255,255,.1); border-radius:14px; background:rgba(255,255,255,.05); color:#fff; font-size:12px; }
    .session-banner .banner img { width:32px; height:32px; border-radius:50%; object-fit:cover; }
    .session-banner .grow { flex:1; min-width:0; }
    .session-banner .grow b,.session-banner .grow span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session-banner .grow span { margin-top:2px; color:#888891; font-size:10px; }
    @media (max-width:860px) { .login-page { grid-template-columns:1fr; } .brand-side { display:none; } .form-side { padding:24px 18px; } .panel-logo { display:block; } .glass-card { padding:31px 24px 26px; } }
    @media (prefers-reduced-motion:reduce) { .intro,.intro-logo,.intro-mark { animation:none; } .intro { display:none; } }
  </style>
</head>
<body data-no-reload-lang>
  <div class="intro" aria-hidden="true"><span class="intro-mark"></span><img class="intro-logo" src="assets/img/LOGO-WHAIT.png" alt=""></div>
  <main class="login-page">
    <section class="brand-side" aria-label="DotStudio POS">
      <div class="brand-top"><img src="assets/img/LOGO-BLACK.png" alt="DotStudio® POS"><span class="brand-pill">POS 2026</span></div>
      <div class="brand-copy"><span class="brand-kicker">DotStudio® POS</span><h1>FROM HERE<br><span style="color:var(--apple-blue)">WE RISE.</span></h1><p>Sales, storefronts, delivery and insight — one calm workspace for every store.</p></div>
      <img src="assets/PH-1.jpg" class="silhouette" alt="Person working at a laptop">
      <div class="brand-foot"><span>Built for modern commerce</span><span>© DotStudio®</span></div>
    </section>
    <section class="form-side">
      <div class="form-wrap">
        <img src="assets/img/LOGO-WHAIT.png" class="panel-logo" alt="DotStudio® POS">
        <div class="glass-card">
          <div class="login-heading"><h2 id="loginTitle">مرحباً بك</h2><p id="loginSubtitle">سجّل الدخول لإدارة متجرك ومتابعة كل شيء من مكان واحد.</p></div>
          <form id="loginForm" novalidate autocomplete="on">
            <div class="login-field"><label id="loginUserLabel" for="loginUser">اسم المستخدم</label><input class="input" id="loginUser" name="username" type="text" autocomplete="username" spellcheck="false" placeholder="أدخل اسم المستخدم" required></div>
            <div class="login-field"><label id="loginPassLabel" for="loginPass">كلمة المرور</label><div class="login-password"><input class="input" id="loginPass" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required><button type="button" id="togglePass" aria-label="Show password"></button></div></div>
            <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>
            <div class="login-options"><label><input type="checkbox" id="remember" checked><span id="rememberLabel">تذكرني</span></label><a href="#" id="forgot">نسيت كلمة المرور؟</a></div>
            <button class="btn btn-primary login-submit" type="submit" id="loginBtn"><span id="loginButtonLabel">تسجيل الدخول</span></button>
          </form>
          <div class="login-note"><span id="loginTrust">تسجيل دخول آمن ومشفّر.</span><br><a href="marketing/index.html">DotStudio® POS</a> · <span id="year"></span></div>
        </div>
      </div>
    </section>
  </main>
  <script src="shared/js/core.js"></script>
  <script src="shared/js/data.js"></script>
  <script>
  (function () {
    'use strict';
    var DS = window.DS, $ = function (s) { return document.querySelector(s); }, icon = DS.icon, esc = DS.esc;
    var copy = {
      ar: { title:'مرحباً بك', sub:'سجّل الدخول لإدارة متجرك ومتابعة كل شيء من مكان واحد.', user:'اسم المستخدم', pass:'كلمة المرور', userPh:'أدخل اسم المستخدم', passPh:'أدخل كلمة المرور', remember:'تذكرني', forgot:'نسيت كلمة المرور؟', login:'تسجيل الدخول', signing:'جارٍ تسجيل الدخول…', trust:'تسجيل دخول آمن ومشفّر.', empty:'أدخل اسم المستخدم وكلمة المرور.', invalid:'بيانات الدخول غير صحيحة.', suspended:'هذا الحساب موقوف.', welcome:'مرحباً بك' },
      en: { title:'Welcome back', sub:'Sign in to manage your store and keep everything moving.', user:'Username', pass:'Password', userPh:'Enter your username', passPh:'Enter your password', remember:'Remember me', forgot:'Forgot password?', login:'Sign in', signing:'Signing in…', trust:'Secure, encrypted sign-in.', empty:'Enter your username and password.', invalid:'Invalid credentials.', suspended:'This account is suspended.', welcome:'Welcome back' }
    };
    function lang() { return DS.lang() === 'en' ? 'en' : 'ar'; }
    function paint() { var c=copy[lang()]; document.documentElement.dir=lang()==='ar'?'rtl':'ltr'; $('#loginTitle').textContent=c.title; $('#loginSubtitle').textContent=c.sub; $('#loginUserLabel').textContent=c.user; $('#loginPassLabel').textContent=c.pass; $('#loginUser').placeholder=c.userPh; $('#loginPass').placeholder=c.passPh; $('#rememberLabel').textContent=c.remember; $('#forgot').textContent=c.forgot; $('#loginButtonLabel').textContent=c.login; $('#loginTrust').textContent=c.trust; }
    function error(text) { var el=$('#loginError'); el.textContent=text; el.classList.add('show'); }
    function clearError() { var el=$('#loginError'); el.textContent=''; el.classList.remove('show'); }
    var pass=$('#loginPass'), toggle=$('#togglePass');
    function paintToggle() { toggle.innerHTML=icon(pass.type==='password'?'eye':'eyeOff'); }
    toggle.addEventListener('click',function(){ pass.type=pass.type==='password'?'text':'password'; paintToggle(); });
    $('#loginForm').addEventListener('submit',function(event){ event.preventDefault(); clearError(); var username=$('#loginUser').value.trim(), password=pass.value, btn=$('#loginBtn'); if(!username||!password){ error(copy[lang()].empty); return; } btn.disabled=true; btn.innerHTML='<span class="spin"></span><span>'+esc(copy[lang()].signing)+'</span>'; setTimeout(function(){ var res=DS.data.login(username,password); if(!res.ok){ btn.disabled=false; btn.innerHTML='<span id="loginButtonLabel">'+esc(copy[lang()].login)+'</span>'; error(res.error==='suspended'?copy[lang()].suspended:copy[lang()].invalid); return; } if($('#remember').checked) localStorage.setItem('ds_last_user',username); DS.toast(copy[lang()].welcome,'success'); setTimeout(function(){ location.href=DS.url(res.redirect||DS.roleHome(res.user)); },220); },220); });
    $('#forgot').addEventListener('click',function(event){ event.preventDefault(); var text=lang()==='en'?'Hello, I need help signing in to DotStudio POS.':'مرحباً، أحتاج مساعدة في تسجيل الدخول إلى DotStudio® POS.'; window.open('https://wa.me/201226770582?text='+encodeURIComponent(text),'_blank','noopener'); });
    try { $('#loginUser').value=localStorage.getItem('ds_last_user')||''; } catch(e) {}
    document.addEventListener('ds:lang',paint); paint(); paintToggle(); $('#year').textContent=new Date().getFullYear();
  })();
  </script>
</body>
</html>
