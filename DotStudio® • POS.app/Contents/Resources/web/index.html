<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DotStudio® POS · Sign in</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="assets/img/LOGO-ICON-DONE.png">
  <link rel="stylesheet" href="shared/css/design-system.css">
  <link rel="stylesheet" href="shared/css/components.css">
  <link rel="stylesheet" href="shared/css/app.css">
  <script src="shared/js/i18n.js"></script>
  <style>
    :root { --login-blue: #007AFF; --login-lime: #82FF1F; }
    html, body { min-height: 100%; background: #000; }
    body { min-height: 100svh; overflow-x: hidden; }
    .login-page { min-height: 100svh; display: grid; grid-template-columns: 1.08fr .92fr; direction: ltr; background: #000; }
    .login-visual { position: relative; min-height: 100svh; overflow: hidden; background: #f4f4f2; color: #09090b; }
    .login-visual::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 22% 30%, rgba(0,122,255,.09), transparent 34%), linear-gradient(135deg, rgba(255,255,255,.96), rgba(240,240,238,.98)); }
    .login-visual::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 55%, rgba(244,244,242,.15)); pointer-events: none; }
    .visual-brand { position: absolute; inset: 30px 42px auto; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .visual-brand img { height: 40px !important; width: auto !important; max-width: 180px !important; object-fit: contain !important; }
    .visual-copy { position: relative; z-index: 3; max-width: 560px; padding: clamp(150px, 18vh, 210px) 42px 0; }
    .visual-kicker { display: inline-flex; padding: 8px 13px; border: 1px solid rgba(0,0,0,.1); border-radius: 999px; color: #333338; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: rgba(255,255,255,.55); backdrop-filter: blur(16px); }
    .visual-copy h1 { margin: 22px 0 16px; max-width: 520px; font-family: var(--font-display); font-size: clamp(48px, 6vw, 88px); line-height: .96; letter-spacing: -.06em; color: #0a0a0c; }
    .visual-copy h1 span { color: var(--login-blue); }
    .visual-copy p { max-width: 430px; color: #5f5f66; font-size: 16px; line-height: 1.7; }
    .login-art { position: absolute; z-index: 2; right: -5%; bottom: -2%; width: 78%; max-width: 820px; height: 74%; object-fit: contain; object-position: right bottom; mix-blend-mode: multiply; filter: contrast(1.04) saturate(.8); }
    .visual-foot { position: absolute; z-index: 3; inset: auto 42px 28px; display: flex; justify-content: space-between; gap: 12px; color: #77777d; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .login-panel { display: flex; align-items: center; justify-content: center; padding: 44px clamp(24px, 6vw, 88px); background: #000; direction: rtl; }
    html[dir="ltr"] .login-panel { direction: ltr; }
    .login-form-wrap { width: min(100%, 390px); }
    .panel-logo { display: none; height: 40px !important; width: auto !important; max-width: 180px !important; object-fit: contain !important; margin-bottom: 38px; }
    .login-heading { margin-bottom: 32px; }
    .login-heading h2 { margin: 0 0 9px; font-size: clamp(30px, 3vw, 40px); letter-spacing: -.04em; }
    .login-heading p { margin: 0; color: var(--text-secondary); font-size: 14px; line-height: 1.7; }
    .login-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .login-field label { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
    .login-field .input { min-height: 54px; border-radius: 15px; }
    .login-password { position: relative; }
    .login-password .input { padding-inline-end: 50px; }
    .login-password button { position: absolute; inset-inline-end: 7px; top: 7px; width: 40px; height: 40px; border-radius: 12px; color: var(--text-secondary); }
    .login-password button:hover { background: var(--surface-2); color: var(--text-primary); }
    .login-password svg { width: 18px; height: 18px; }
    .login-options { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 22px; color: var(--text-secondary); font-size: 12px; }
    .login-options label { display: inline-flex; align-items: center; gap: 7px; }
    .login-options a { color: var(--accent-blue); font-weight: 600; }
    .login-error { display: none; margin: 0 0 14px; padding: 11px 13px; border: 1px solid var(--danger); border-radius: 12px; color: #ff8179; background: var(--danger-soft); font-size: 12px; }
    .login-error.show { display: block; }
    .login-submit { width: 100%; min-height: 54px; border-radius: 15px; }
    .login-note { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--text-tertiary); font-size: 11px; line-height: 1.7; text-align: center; }
    .login-note a { color: var(--text-secondary); }
    .session-banner { margin-bottom: 18px; }
    .session-banner:empty { display: none; }
    .session-banner .banner { display: flex; align-items: center; gap: 9px; padding: 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); font-size: 12px; }
    .session-banner .banner img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .session-banner .grow { flex: 1; min-width: 0; }
    .session-banner .grow b, .session-banner .grow span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-banner .grow span { margin-top: 2px; color: var(--text-secondary); font-size: 10px; }
    @media (max-width: 860px) { .login-page { grid-template-columns: 1fr; } .login-visual { display: none; } .login-panel { min-height: 100svh; padding: 30px 20px; } .panel-logo { display: block; } }
    @media (max-width: 480px) { .login-panel { padding: 24px 16px; } .login-heading { margin-bottom: 26px; } }
  </style>
</head>
<body data-no-reload-lang>
  <main class="login-page">
    <section class="login-visual" aria-label="DotStudio POS">
      <div class="visual-brand"><img src="assets/img/LOGO-BLACK.png" class="logo" alt="DotStudio® POS"><span class="badge neutral">POS 2026</span></div>
      <div class="visual-copy"><span class="visual-kicker">DotStudio® POS</span><h1>FROM HERE<br><span>WE RISE.</span></h1><p>Sales, storefronts, delivery and insight — one calm workspace for every store.</p></div>
      <img src="assets/PH-1.jpg" class="login-art" alt="Person working at a laptop">
      <div class="visual-foot"><span>Built for modern commerce</span><span>© DotStudio®</span></div>
    </section>
    <section class="login-panel">
      <div class="login-form-wrap">
        <img src="assets/img/LOGO-WHAIT.png" class="panel-logo logo" alt="DotStudio® POS">
        <div class="login-heading"><h2 id="loginTitle">مرحباً بك</h2><p id="loginSubtitle">سجّل الدخول لإدارة متجرك ومتابعة كل شيء من مكان واحد.</p></div>
        <div id="sessionBanner" class="session-banner"></div>
        <form id="loginForm" novalidate autocomplete="on">
          <div class="login-field"><label id="loginUserLabel" for="loginUser">اسم المستخدم</label><input class="input" id="loginUser" name="username" type="text" autocomplete="username" spellcheck="false" placeholder="أدخل اسم المستخدم" required></div>
          <div class="login-field"><label id="loginPassLabel" for="loginPass">كلمة المرور</label><div class="login-password"><input class="input" id="loginPass" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required><button type="button" id="togglePass" aria-label="Show password"></button></div></div>
          <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>
          <div class="login-options"><label><input type="checkbox" id="remember" checked><span id="rememberLabel">تذكرني</span></label><a href="#" id="forgot">نسيت كلمة المرور؟</a></div>
          <button class="btn btn-primary login-submit" type="submit" id="loginBtn"><span id="loginButtonLabel">تسجيل الدخول</span></button>
        </form>
        <div class="login-note"><span id="loginTrust">تسجيل دخول آمن ومشفّر.</span><br><a href="marketing/index.html">DotStudio® POS</a> · <span id="year"></span></div>
      </div>
    </section>
  </main>
  <script src="shared/js/core.js"></script>
  <script src="shared/js/data.js"></script>
  <script>
  (function () {
    'use strict';
    var DS = window.DS, $ = function (s) { return document.querySelector(s); }, icon = DS.icon, esc = DS.esc;
    var copy = {
      ar: { title: 'مرحباً بك', sub: 'سجّل الدخول لإدارة متجرك ومتابعة كل شيء من مكان واحد.', user: 'اسم المستخدم', pass: 'كلمة المرور', userPh: 'أدخل اسم المستخدم', passPh: 'أدخل كلمة المرور', remember: 'تذكرني', forgot: 'نسيت كلمة المرور؟', login: 'تسجيل الدخول', signing: 'جارٍ تسجيل الدخول…', trust: 'تسجيل دخول آمن ومشفّر.', empty: 'أدخل اسم المستخدم وكلمة المرور.', invalid: 'بيانات الدخول غير صحيحة.', suspended: 'هذا الحساب موقوف.', welcome: 'مرحباً بك' },
      en: { title: 'Welcome back', sub: 'Sign in to manage your store and keep everything moving.', user: 'Username', pass: 'Password', userPh: 'Enter your username', passPh: 'Enter your password', remember: 'Remember me', forgot: 'Forgot password?', login: 'Sign in', signing: 'Signing in…', trust: 'Secure, encrypted sign-in.', empty: 'Enter your username and password.', invalid: 'Invalid credentials.', suspended: 'This account is suspended.', welcome: 'Welcome back' }
    };
    function lang() { return DS.lang() === 'en' ? 'en' : 'ar'; }
    function paint() { var c = copy[lang()]; document.documentElement.dir = lang() === 'ar' ? 'rtl' : 'ltr'; $('#loginTitle').textContent = c.title; $('#loginSubtitle').textContent = c.sub; $('#loginUserLabel').textContent = c.user; $('#loginPassLabel').textContent = c.pass; $('#loginUser').placeholder = c.userPh; $('#loginPass').placeholder = c.passPh; $('#rememberLabel').textContent = c.remember; $('#forgot').textContent = c.forgot; $('#loginButtonLabel').textContent = c.login; $('#loginTrust').textContent = c.trust; }
    function error(text) { var el = $('#loginError'); el.textContent = text; el.classList.add('show'); }
    function clearError() { var el = $('#loginError'); el.textContent = ''; el.classList.remove('show'); }
    var pass = $('#loginPass'), toggle = $('#togglePass');
    function paintToggle() { toggle.innerHTML = icon(pass.type === 'password' ? 'eye' : 'eyeOff'); }
    toggle.addEventListener('click', function () { pass.type = pass.type === 'password' ? 'text' : 'password'; paintToggle(); });
    var current = DS.session();
    if (current) { $('#sessionBanner').innerHTML = '<div class="banner"><img src="' + esc(DS.avatarUrl(current)) + '" alt=""><div class="grow"><b>' + esc(DS.loc(current, 'name')) + '</b><span>' + esc(DS.t('login.sessionActive')) + '</span></div><a class="btn btn-primary btn-sm" href="' + esc(DS.url(DS.roleHome(current))) + '">' + esc(DS.t('login.continue')) + '</a><button type="button" class="btn btn-secondary btn-sm" id="switchUser">' + esc(DS.t('login.switchAccount')) + '</button></div>'; $('#switchUser').addEventListener('click', function () { DS.logout(true); $('#sessionBanner').innerHTML = ''; }); }
    $('#loginForm').addEventListener('submit', function (event) { event.preventDefault(); clearError(); var username = $('#loginUser').value.trim(), password = pass.value, btn = $('#loginBtn'); if (!username || !password) { error(copy[lang()].empty); return; } btn.disabled = true; btn.innerHTML = '<span class="spin"></span><span>' + esc(copy[lang()].signing) + '</span>'; setTimeout(function () { var res = DS.data.login(username, password); if (!res.ok) { btn.disabled = false; btn.innerHTML = '<span id="loginButtonLabel">' + esc(copy[lang()].login) + '</span>'; error(res.error === 'suspended' ? copy[lang()].suspended : copy[lang()].invalid); return; } if ($('#remember').checked) localStorage.setItem('ds_last_user', username); DS.toast(copy[lang()].welcome, 'success'); setTimeout(function () { location.href = DS.url(res.redirect || DS.roleHome(res.user)); }, 220); }, 220); });
    $('#forgot').addEventListener('click', function (event) { event.preventDefault(); var text = lang() === 'en' ? 'Hello, I need help signing in to DotStudio POS.' : 'مرحباً، أحتاج مساعدة في تسجيل الدخول إلى DotStudio® POS.'; window.open('https://wa.me/201226770582?text=' + encodeURIComponent(text), '_blank', 'noopener'); });
    try { $('#loginUser').value = localStorage.getItem('ds_last_user') || ''; } catch (e) {}
    document.addEventListener('ds:lang', paint); paint(); paintToggle(); $('#year').textContent = new Date().getFullYear();
  })();
  </script>

    <script id="mock-login-override">
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            const form = document.querySelector('form');
            if(form) form.onsubmit = function(e) { e.preventDefault(); return false; };

            const buttons = Array.from(document.querySelectorAll('button, input[type="submit"]'));
            const loginBtn = buttons.find(b => b.innerText.includes('دخول') || b.innerText.includes('Login') || b.id === 'loginBtn');

            if (loginBtn) {
                const newBtn = loginBtn.cloneNode(true);
                loginBtn.parentNode.replaceChild(newBtn, loginBtn);

                newBtn.onclick = function(e) {
                    e.preventDefault();
                    const userInp = document.querySelector('input[type="text"]') || document.getElementById('loginUser');
                    const passInp = document.querySelector('input[type="password"]') || document.getElementById('loginPass');
                    if(!userInp || !passInp) return;

                    const u = userInp.value.trim().toLowerCase();
                    const p = passInp.value.trim().toLowerCase();

                    if (u === 'admin' && p === 'admin2026') {
                        window.location.href = 'admin/dashboard.html';
                    } else if (u === 'owner' && p === 'owner2026') {
                        window.location.href = 'owner/dashboard.html';
                    } else if ((u === 'cashier' || u === 'sm_cashier') && (p === 'cashier2026' || p === 'sm_cashier2026')) {
                        window.location.href = 'cashier/pos.html';
                    } else {
                        alert('بيانات غير صحيحة!');
                    }
                };
            }
        }, 500);
    });
    </script>
    
                <script id="kill-sw.js">
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        }
                    });
                }
                </script>
                </body>
                
    
</html>
