  <script>
    /* Apply the saved customer theme before paint (no white flash). Dark is default. */
    (function () {
      try {
        var t = localStorage.getItem('ds_customer_theme');
        var theme = (t === 'light' || t === 'dark') ? t : 'light';
        document.documentElement.setAttribute('data-customer-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0A0A0A' : '#ffffff');
      } catch (e) {
        document.documentElement.setAttribute('data-customer-theme', 'light');
      }
    })();
  </script>
