<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>المتجر · DotStudio® POS</title>
  <meta name="description" content="DotStudio® POS — تسوق من أفضل المتاجر المستقلة في تجربة واحدة.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="../assets/img/LOGO-ICON-DONE.png">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../shared/css/design-system.css?v=20261026e">
  <link rel="stylesheet" href="../shared/css/components.css?v=20261026e">

  <style>
    /* ═══════════════════════════════════════════════════════════════
       BLAZITY-STYLE STOREFRONT — pure white edition.
       Standalone page. Does not touch storefront.html or shared CSS.
       Palette: #FFFFFF paper · #000000 ink · #82FF1F accent.
       ═══════════════════════════════════════════════════════════════ */
    body.bz {
      --bz-paper: #FFFFFF;
      --bz-ink: #000000;
      --bz-ink-soft: #4F4F4F;
      --bz-muted: #8A8A8A;
      --bz-line: #ECECEC;
      --bz-wash: #F6F6F3;
      --bz-lime: #82FF1F;
      --bz-lime-deep: #6BE600;
      --bz-shadow: 0 30px 70px rgba(0, 0, 0, 0.12);
      --bz-shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.10);
      --bz-ease: cubic-bezier(0.22, 1, 0.36, 1);

      margin: 0;
      min-height: 100vh;
      background: var(--bz-paper);
      color: var(--bz-ink);
      font-family: 'SF Pro Arabic', 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    html { background: #FFFFFF; }
    body.bz ::selection { background: var(--bz-lime); color: #000; }
    body.bz svg { width: 18px; height: 18px; flex: none; }
    body.bz img { max-width: 100%; }
    body.bz a { color: inherit; text-decoration: none; }
    body.bz button { font-family: inherit; cursor: pointer; }
    body.bz :focus-visible { outline: 2px solid var(--bz-lime); outline-offset: 3px; }
    body.bz.bz-drawer-open { overflow: hidden; }

    .bz-shell {
      width: 100%;
      max-width: 1480px;
      margin-inline: auto;
      padding-inline: clamp(18px, 4vw, 56px);
    }

    /* ─────────────────────── ANNOUNCEMENT BAR ─────────────────────── */
    .bz-announce {
      background: #000;
      color: #fff;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-align: center;
      padding: 11px 18px;
    }
    .bz-announce span {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      justify-content: center;
    }
    .bz-announce i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--bz-lime);
      flex: none;
    }

    /* ──────────────────────────── NAVBAR ──────────────────────────── */
    .bz-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--bz-line);
      transition: box-shadow 260ms var(--bz-ease);
    }
    .bz-nav.is-stuck { box-shadow: 0 12px 34px rgba(0, 0, 0, 0.06); }
    .bz-nav-inner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 24px;
      min-height: 82px;
      padding-block: 12px;
    }
    .bz-logo {
      display: inline-flex;
      align-items: center;
      line-height: 0;
      justify-self: start;
    }
    .bz-logo img {
      height: 40px !important;
      width: auto !important;
      display: block;
    }
    .bz-logo .bz-logo-mark { display: none; }
    .bz-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 2.4vw, 38px);
      min-width: 0;
    }
    .bz-links a {
      position: relative;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #2B2B2B;
      padding-block: 6px;
      transition: color 180ms;
      white-space: nowrap;
    }
    .bz-links a::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      height: 1.5px;
      background: #000;
      transform: scaleX(0);
      transform-origin: var(--bz-origin, left);
      transition: transform 240ms var(--bz-ease);
    }
    html[dir="rtl"] .bz-links a::after { --bz-origin: right; }
    .bz-links a:hover { color: #000; }
    .bz-links a:hover::after { transform: scaleX(1); }

    .bz-nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: end;
    }
    .bz-lang {
      height: 38px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #6A6A6A;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      transition: background 180ms, color 180ms;
    }
    .bz-lang:hover { background: var(--bz-wash); color: #000; }
    .bz-cart {
      position: relative;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid var(--bz-line);
      border-radius: 50%;
      background: #fff;
      color: #000;
      transition: background 220ms, color 220ms, border-color 220ms, transform 220ms var(--bz-ease);
    }
    .bz-cart:hover {
      background: #000;
      border-color: #000;
      color: #fff;
      transform: translateY(-1px);
    }
    .bz-cart svg { width: 19px; height: 19px; }
    .bz-cart-count {
      position: absolute;
      top: -3px;
      inset-inline-end: -3px;
      min-width: 20px;
      height: 20px;
      padding-inline: 5px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--bz-lime);
      color: #000;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1;
      border: 2px solid #fff;
      font-variant-numeric: tabular-nums;
    }

    /* ───────────────────────────── HERO ───────────────────────────── */
    .bz-hero {
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      align-items: center;
      gap: clamp(30px, 5vw, 76px);
      padding-block: clamp(36px, 5.4vw, 82px) clamp(46px, 6vw, 96px);
    }
    .bz-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6E6E6E;
    }
    .bz-eyebrow i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bz-lime);
      box-shadow: 0 0 0 4px rgba(130, 255, 31, 0.18);
      flex: none;
    }
    .bz-hero h1 {
      margin: 18px 0 0;
      font-size: clamp(46px, 5.6vw, 90px);
      line-height: 0.94;
      letter-spacing: -0.045em;
      font-weight: 800;
      color: #000;
      text-wrap: balance;
    }
    html[lang="ar"] .bz-hero h1 {
      font-size: clamp(40px, 5.2vw, 82px);
      line-height: 1.08;
      letter-spacing: 0;
    }
    .bz-hero h1 span { display: block; }
    .bz-hero h1 span:last-child { color: #A3A3A3; }
    .bz-hero-sub {
      margin: 22px 0 0;
      max-width: 540px;
      font-size: clamp(14px, 1.2vw, 16.5px);
      line-height: 1.75;
      color: var(--bz-ink-soft);
    }
    .bz-hero-cta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
    }
    .bz-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 56px;
      padding-inline: 30px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition: background 240ms, color 240ms, border-color 240ms, transform 240ms var(--bz-ease);
    }
    .bz-btn:active { transform: scale(0.985); }
    .bz-btn-primary {
      background: var(--bz-lime);
      color: #000;
    }
    .bz-btn-primary:hover {
      background: #000;
      color: var(--bz-lime);
    }
    .bz-btn-ghost {
      background: transparent;
      border-color: #000;
      color: #000;
    }
    .bz-btn-ghost:hover {
      background: #000;
      color: #fff;
    }
    .bz-hero-meta {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 38px;
      flex-wrap: wrap;
    }
    .bz-hero-meta div {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .bz-hero-meta div + div {
      border-inline-start: 1px solid var(--bz-line);
      padding-inline-start: 24px;
    }
    .bz-hero-meta b {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .bz-hero-meta span {
      font-size: 11px;
      color: var(--bz-muted);
      letter-spacing: 0.04em;
    }

    .bz-hero-media {
      position: relative;
      min-width: 0;
    }
    .bz-media-frame {
      position: relative;
      height: clamp(440px, 60vh, 640px);
      border-radius: 30px;
      overflow: hidden;
      background: var(--bz-wash);
    }
    .bz-media-frame > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1.02);
      transition: transform 1.1s var(--bz-ease);
    }
    .bz-hero-media:hover .bz-media-frame > img { transform: scale(1.045); }
    .bz-media-chip {
      position: absolute;
      top: 20px;
      inset-inline-start: 20px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      font-size: 10.5px;
      font-weight: 600;
      color: #000;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    }
    .bz-media-chip i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--bz-lime);
      flex: none;
    }

    /* Floating product card overlapping the hero image */
    .bz-float {
      position: absolute;
      inset-inline-end: -26px;
      bottom: 34px;
      z-index: 3;
      width: min(306px, calc(100% - 24px));
      padding: 14px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid #F0F0F0;
      box-shadow: 0 26px 64px rgba(0, 0, 0, 0.16);
      transition: transform 320ms var(--bz-ease), box-shadow 320ms;
    }
    .bz-float:hover {
      transform: translateY(-5px);
      box-shadow: 0 34px 78px rgba(0, 0, 0, 0.20);
    }
    .bz-float-inner {
      display: grid;
      grid-template-columns: 60px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }
    .bz-float-inner > img {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--bz-wash);
    }
    .bz-float-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .bz-float-store {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bz-muted);
    }
    .bz-float-info b {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      color: #000;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .bz-float-price {
      font-size: 12.5px;
      font-weight: 700;
      color: #000;
      font-variant-numeric: tabular-nums;
    }
    .bz-float-add,
    .bz-add {
      display: grid;
      place-items: center;
      border: 1px solid #E3E3E3;
      border-radius: 50%;
      background: #fff;
      color: #000;
      transition: background 200ms, color 200ms, border-color 200ms, transform 200ms var(--bz-ease);
    }
    .bz-float-add {
      width: 36px;
      height: 36px;
    }
    .bz-float-add svg { width: 15px; height: 15px; }
    .bz-float-add:hover,
    .bz-add:hover:not(:disabled) {
      background: var(--bz-lime);
      border-color: var(--bz-lime);
      color: #000;
      transform: scale(1.06);
    }
    .bz-float-add b,
    .bz-add b {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1;
    }
    .bz-float-add.is-in,
    .bz-add.is-in {
      background: #000;
      border-color: #000;
      color: var(--bz-lime);
    }
    .bz-float-note {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid #F2F2F2;
      font-size: 10px;
      font-weight: 500;
      color: #7A7A7A;
      letter-spacing: 0.02em;
    }
    .bz-float-note i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--bz-lime);
      flex: none;
    }

    /* ───────────────────────── BENEFIT STRIP ───────────────────────── */
    .bz-benefits {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-block: 1px solid var(--bz-line);
    }
    .bz-benefit {
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .bz-benefit + .bz-benefit { border-inline-start: 1px solid var(--bz-line); }
    .bz-benefit b {
      font-size: 13px;
      font-weight: 600;
      color: #000;
    }
    .bz-benefit span {
      font-size: 11.5px;
      color: var(--bz-muted);
      letter-spacing: 0.01em;
    }

    /* ──────────────────────────── CATALOG ─────────────────────────── */
    .bz-catalog { padding-block: clamp(48px, 6vw, 86px) 20px; }
    .bz-catalog-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    .bz-catalog-head h2 {
      margin: 10px 0 0;
      font-size: clamp(30px, 3.4vw, 48px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: #000;
    }
    html[lang="ar"] .bz-catalog-head h2 { letter-spacing: 0; }
    .bz-search {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 50px;
      width: min(350px, 100%);
      padding-inline: 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--bz-wash);
      color: #8A8A8A;
      transition: background 200ms, border-color 200ms;
    }
    .bz-search:focus-within {
      background: #fff;
      border-color: #000;
    }
    .bz-search svg { width: 17px; height: 17px; }
    .bz-search input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      color: #000;
    }
    .bz-search input::placeholder { color: #9A9A9A; }

    .bz-store-rail { margin-top: 40px; }
    .bz-rail-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--bz-muted);
      margin-bottom: 12px;
    }
    .bz-stores {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .bz-stores::-webkit-scrollbar { display: none; }
    .bz-storebtn {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 46px;
      padding: 0 15px 0 9px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--bz-wash);
      color: #3A3A3A;
      font-size: 12.5px;
      font-weight: 500;
      transition: background 200ms, color 200ms, border-color 200ms;
    }
    html[dir="ltr"] .bz-storebtn { padding: 0 9px 0 15px; }
    .bz-storebtn:hover { border-color: #DADADA; }
    .bz-storebtn.is-on {
      background: #000;
      color: #fff;
    }
    .bz-storebtn .bz-store-initial {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.06);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0;
      color: #000;
      flex: none;
    }
    .bz-storebtn .bz-store-initial svg { width: 13px; height: 13px; }
    .bz-storebtn.is-on .bz-store-initial {
      background: rgba(255, 255, 255, 0.16);
      color: var(--bz-lime);
    }
    .bz-storebtn .bz-store-count {
      font-size: 10.5px;
      font-weight: 600;
      color: #9A9A9A;
      font-variant-numeric: tabular-nums;
    }
    .bz-storebtn.is-on .bz-store-count { color: rgba(255, 255, 255, 0.55); }

    .bz-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--bz-line);
    }
    .bz-chips {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .bz-chips::-webkit-scrollbar { display: none; }
    .bz-chip {
      flex: none;
      height: 38px;
      padding-inline: 16px;
      border: 1px solid var(--bz-line);
      border-radius: 999px;
      background: transparent;
      color: #555;
      font-size: 12px;
      font-weight: 500;
      transition: background 180ms, color 180ms, border-color 180ms;
    }
    .bz-chip:hover { border-color: #BDBDBD; color: #000; }
    .bz-chip.is-on {
      background: #000;
      border-color: #000;
      color: #fff;
    }
    .bz-count {
      flex: none;
      font-size: 11.5px;
      color: var(--bz-muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .bz-count b { color: #000; font-weight: 600; }

    /* ────────────────────────── PRODUCT GRID ───────────────────────── */
    .bz-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(22px, 2.6vw, 38px) clamp(14px, 1.6vw, 24px);
      margin-top: clamp(24px, 2.6vw, 34px);
    }
    .bz-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 0 0 6px;
      border: 0;
      border-radius: 18px;
      background: #fff;
      transition: transform 340ms var(--bz-ease), box-shadow 340ms var(--bz-ease);
    }
    @media (hover: hover) {
      .bz-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--bz-shadow-soft);
      }
    }
    .bz-media {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      background: var(--bz-wash);
    }
    .bz-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 850ms var(--bz-ease);
    }
    .bz-card:hover .bz-media img { transform: scale(1.045); }
    .bz-badge {
      position: absolute;
      top: 10px;
      inset-inline-start: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    .bz-badge.is-lime { background: var(--bz-lime); color: #000; box-shadow: none; }
    .bz-badge.is-dark { background: rgba(0, 0, 0, 0.82); color: #fff; box-shadow: none; }

    .bz-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 14px 4px 4px;
    }
    .bz-name {
      margin: 0;
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.005em;
      color: #000;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1.4em * 2);
    }
    .bz-store {
      margin-top: 4px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--bz-muted);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bz-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 12px;
    }
    .bz-price {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #000;
      font-variant-numeric: tabular-nums;
    }
    .bz-add {
      width: 40px;
      height: 40px;
    }

    /* ─────────────────────── FLOATING CART BADGE ──────────────────── */
    .bz-float-cart {

      left: 24px;

    .bz-fc-go {

    .bz-vname { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

    .bz-vname span { font-size: 10px; color: var(--bz-muted); }
    .bz-vfee {
      margin-inline-start: auto;

      white-space: nowrap;

    }
    .bz-line {

    .bz-line-end {

    .bz-line-x {

    .bz-warn {
      display: flex;

      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #FFF7E8;
      color: #7A4B00;
      font-size: 11px;
      line-height: 1.55;
    }
    .bz-warn svg { width: 14px; height: 14px; margin-top: 1px; }

    .bz-bag-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 9px;
      padding: 64px 16px 40px;
    }
    .bz-bag-empty > svg { width: 30px; height: 30px; color: #B0B0B0; }
    .bz-bag-empty b { font-size: 15px; font-weight: 600; }
    .bz-bag-empty span { font-size: 12px; color: var(--bz-muted); max-width: 260px; line-height: 1.6; }

    .bz-secure {

      align-items: center;
      justify-content: center;

      margin: 7px 0 0;

    /* White toasts for this page */
    body.bz .toast-stack {
      bottom: 24px;
      inset-inline-end: 24px;
      z-index: 120;
    }
    body.bz .toast {
      background: #fff;
      border: 1px solid #E9E9E9;

    }
    body.bz .toast::before { background: var(--bz-lime); }
    body.bz .toast.error::before { background: #FF3B30; }
    body.bz .toast.warning::before { background: #FFB020; }
    body.bz .toast-title { color: #000; }
    body.bz .toast-msg { color: #666; }
    body.bz .toast-x { color: #999; }
    body.bz .toast-x:hover { background: #F3F3F3; color: #000; }

  /* ═══════════════════════════════════════════════════════════════

  (function () {
    'use strict';

    var DS = window.DS;
    if (!DS) return;

    var user = DS.session();
    if (!user) { location.replace(DS.url('index.html')); return; }

    var esc = DS.esc, icon = DS.icon, money = DS.money, url = DS.url;
    var EN = DS.lang() === 'en';

    /* ─────────────────────────── COPY ─────────────────────────── */
    var L = EN ? {
      pageTitle: 'Store',

      navProducts: 'Products', navStores: 'Stores', navOrders: 'My orders', navTracking: 'Track order',

    } : {

      heroTitle2: 'لنمط حياة عصري.',

      ctaShop: 'تسوق الآن', ctaStores: 'استكشف المتاجر',
      metaStores: 'متاجر موثوقة', metaTime: 'دقيقة للتوصيل', metaSecure: 'دفع آمن',
      mediaChip: 'تقييم 4.9 · أكثر من 12,000 عميل',
      floatNote: 'متوفر · يصلك خلال 30 دقيقة',
      benefit1: 'توصيل سريع', benefit1Sub: 'من 30 إلى 45 دقيقة داخل القاهرة',
      benefit2: 'إرجاع مجاني', benefit2Sub: 'خلال 14 يوم بدون أسئلة',
      benefit3: 'دفع آمن', benefit3Sub: 'بطاقة أو نقداً عند الاستلام',
      benefit4: 'دعم حقيقي', benefit4Sub: 'فريق بشري يومياً من 9 إلى 12',
      catalogKicker: 'الكتالوج',
      catalogTitle: 'منتجات مختارة',
      search: 'ابحث عن منتج أو متجر…',
      storesLabel: 'تسوق حسب المتجر', allStores: 'كل المتاجر',
      all: 'الكل',
      products: 'منتج', storesWord: 'متاجر',
      inStock: 'متوفر', out: 'نفدت الكمية', offline: 'أوفلاين', best: 'الأكثر مبيعاً', featured: 'مميز',
      add: 'أضف إلى السلة', added: 'أضيف إلى السلة',
      bag: 'سلة التسوق', bagEmpty: 'سلتك فارغة',
      bagEmptyText: 'أضف قطعة تعجبك وستظهر هنا فوراً.',
      browse: 'تصفح المنتجات', checkout: 'إتمام الطلب',
      secure: 'دفع آمن · إرجاع مجاني',
      subtotal: 'المجموع الفرعي', delivery: 'التوصيل', total: 'الإجمالي',
      closedWarn: 'متجر أوفلاين: ', closedWarnEnd: '. احذف منتجاته لإتمام الطلب.',
      remove: 'إزالة',
      scanOk: 'تم مسح الباركود وأضيف للسلة', scanNo: 'الباركود غير موجود',
      footerTag: 'منصة تجارة حديثة تربط أفضل المتاجر المستقلة في تجربة واحدة بسيطة.',
      footerShop: 'المتجر', footerHelp: 'المساعدة', footerHours: 'مفتوح يومياً · 9:00 – 24:00',
      footerChat: 'دعم واتساب',
      copyright: '© 2026 DotStudio® POS — جميع الحقوق محفوظة.',
      footerMade: 'صُنع بعناية في القاهرة',
      items: 'منتجات', item: 'منتج', store: 'متجر', storesPlural: 'متاجر',
      viewBag: 'عرض السلة', footerOffline: 'أوفلاين'
    };

    /* ─────────────────────── STATIC TEXT / ICONS ───────────────────── */
    document.title = L.pageTitle + ' · DotStudio® POS';
    document.documentElement.lang = EN ? 'en' : 'ar';
    document.documentElement.dir = EN ? 'ltr' : 'rtl';

    DS.$$('[data-t]').forEach(function (el) {
      var key = el.getAttribute('data-t');
      if (L[key]) el.textContent = L[key];
    });
    DS.$$('[data-icon]').forEach(function (el) {
      el.innerHTML = icon(el.getAttribute('data-icon'));
    });
    /* Direction-aware arrows. */
    DS.$$('[data-arrow]').forEach(function (el) {
      el.innerHTML = icon(EN ? 'arrowRight' : 'arrowLeft');
    });
    var langBtn = DS.$('[data-lang-toggle]');
    if (langBtn) {
      langBtn.textContent = L.lang;
      langBtn.addEventListener('click', function () {
        DS.setLang(EN ? 'ar' : 'en');
        location.reload();
      });
    }
    var searchEl = DS.$('[data-search]');
    if (searchEl) searchEl.setAttribute('placeholder', L.search);

    /* Navigation must go through DS.url(). */
    DS.$$('[data-nav]').forEach(function (a) {
      a.setAttribute('href', url(a.getAttribute('data-nav')));
    });

    /* ───────────────────────────── DATA ───────────────────────────── */
    var state = { q: '', cat: '', store: '' };
    var cart = loadCart();

    function tenants() {
      return (DS.data.tenants || []).filter(function (tn) { return tn.status !== 'suspended'; });
    }
    function allProducts() {
      var live = {};
      tenants().forEach(function (tn) { live[tn.id] = true; });
      return (DS.data.products || []).filter(function (p) {
        return p && p.is_active !== false && live[p.tenant_id];
      });
    }
    function storeOf(p) { return DS.data.tenantById(p && p.tenant_id); }
    function storeOpen(tn) { return DS.data.isStoreOpen ? DS.data.isStoreOpen(tn) : true; }
    function imgOf(p) { return DS.data.img(p.image); }
    function pname(p) { return EN ? (p.name_en || p.name) : (p.name || p.name_en); }
    function pcat(p) { return EN ? (p.category_en || p.category) : (p.category || p.category_en); }
    function tname(tn) { return tn ? (EN ? (tn.name_en || tn.name) : (tn.name || tn.name_en)) : ''; }
    function initial(name) { return String(name || '?').trim().charAt(0).toUpperCase(); }
    function productCount(tnId) {
      return allProducts().filter(function (p) { return p.tenant_id === tnId; }).length;
    }

    /* ───────────────────────────── CART ───────────────────────────── */
    function loadCart() {
      var raw = DS.store.get('ds_cart', null);
      if (raw && Array.isArray(raw.items)) {
        return { items: raw.items.filter(function (l) { return l && l.id; }) };
      }
      return { items: [] };
    }
    function saveCart() { DS.store.set('ds_cart', cart); }
    function cartCount() {
      return cart.items.reduce(function (s, l) { return s + (Number(l.qty) || 0); }, 0);
    }
    function cartTotal() {
      return cart.items.reduce(function (s, l) { return s + (Number(l.price) || 0) * (Number(l.qty) || 0); }, 0);
    }
    function lineOf(id) {
      return cart.items.filter(function (l) { return l.id === id; })[0];
    }
    function vendorIds() {
      var out = [];
      cart.items.forEach(function (l) {
        if (l.tenant_id && out.indexOf(l.tenant_id) === -1) out.push(l.tenant_id);
      });
      return out;
    }
    function groups() {
      return vendorIds().map(function (id) {
        return {
          tenant: DS.data.tenantById(id),
          items: cart.items.filter(function (l) { return l.tenant_id === id; })
        };
      }).filter(function (g) { return g.tenant && g.items.length; });
    }
    function vendorFee(id) {
      var tn = DS.data.tenantById(id);
      return tn ? (Number(tn.delivery_fee) || 0) : 0;
    }
    /* One delivery per vendor → the bag shows the sum of their fees. */
    function deliveryFee() {
      return vendorIds().reduce(function (s, id) { return s + vendorFee(id); }, 0);
    }
    function closedVendors() {
      return flatMap(groups(), function (g) { return storeOpen(g.tenant) ? [] : [tname(g.tenant)]; });
    }
    function flatMap(list, fn) {
      return list.reduce(function (out, item) { return out.concat(fn(item)); }, []);
    }

    function addToCart(id, silent) {
      var p = allProducts().filter(function (x) { return x.id === id; })[0];
      if (!p) return false;
      var tn = storeOf(p);
      if (!tn) return false;
      if (!storeOpen(tn)) {
        DS.toast(EN ? tname(tn) + ' is offline right now.' : 'متجر ' + tname(tn) + ' أوفلاين حالياً.', 'error');
        return false;
      }
      if ((Number(p.stock) || 0) <= 0) { DS.toast(L.out, 'warning'); return false; }
      var line = lineOf(p.id);
      var wanted = line ? (Number(line.qty) || 0) + 1 : 1;
      if (wanted > p.stock) { DS.toast(L.out, 'warning'); return false; }
      if (line) line.qty = wanted;
      else cart.items.push({
        id: p.id, name: p.name, name_en: p.name_en, price: Number(p.price) || 0,
        qty: 1, image: p.image, stock: p.stock, tenant_id: p.tenant_id
      });
      saveCart();
      renderCart();
      if (!silent) DS.toast(pname(p) + ' · ' + L.added, 'success');
      return true;
    }

    function setQty(id, qty) {
      var line = lineOf(id);
      if (!line) return;
      var max = Number(line.stock) || 0;
      if (qty <= 0) {
        cart.items = cart.items.filter(function (l) { return l.id !== id; });
      } else if (max && qty > max) {
        DS.toast(L.out, 'warning');
        return;
      } else {
        line.qty = qty;
      }
      saveCart();
      renderCart();
    }

    function renderCart() {
      var count = cartCount();
      var fee = deliveryFee();

      DS.$$('[data-cart-count]').forEach(function (el) { el.textContent = count; });

      var pill = DS.$('[data-floating-cart]') || DS.$('.bz-float-cart');
      if (pill) {
        var on = count > 0;
        pill.classList.toggle('is-on', on);
        pill.setAttribute('aria-hidden', on ? 'false' : 'true');
        pill.tabIndex = on ? 0 : -1;
        var fc = pill.querySelector('[data-fc-count]');
        if (fc) fc.textContent = count;
        var tot = pill.querySelector('[data-fc-total]');
        if (tot) tot.textContent = money(cartTotal() + fee);
        var sub = pill.querySelector('[data-fc-sub]');
        if (sub) {
          var n = groups().length;
          sub.textContent = n > 1
            ? (EN ? n + ' stores' : n + ' ' + L.storesPlural)
            : (groups()[0] ? tname(groups()[0].tenant) : '');
        }
      }

      /* Keep every add button (grid, hero card) honest. */
      DS.$$('[data-add]').forEach(function (b) {
        var line = lineOf(b.getAttribute('data-add'));
        b.classList.toggle('is-in', !!line);
        if (!b.disabled) b.innerHTML = line ? '<b>' + line.qty + '</b>' : icon('plus');
      });

      if (document.body.classList.contains('bz-drawer-open')) renderDrawer();
    }

    function bindAddButtons(scope) {
      DS.$$('[data-add]', scope || document).forEach(function (b) {
        if (b.getAttribute('data-bound')) return;
        b.setAttribute('data-bound', '1');
        b.addEventListener('click', function () {
          if (b.disabled) return;
          var card = b.closest('.bz-card');
          if (!addToCart(b.getAttribute('data-add'))) return;
          if (card) {
            card.classList.add('just-added');
            setTimeout(function () { card.classList.remove('just-added'); }, 450);
          }
        });
      });
    }

    /* ─────────────────────────── HERO CARD ────────────────────────── */
    function heroProduct() {
      var list = allProducts().filter(function (p) { return (Number(p.stock) || 0) > 0; });
      /* Prefer a product whose photo matches its name (Caznova fragrance). */
      return list.filter(function (p) {
        return p.tenant_id === 't-caznova' && /perfume/i.test(p.image || '');
      })[0] || list.filter(function (p) {
        return p.tenant_id === 't-caznova';
      })[0] || list[0];
    }

    function renderHeroCard() {
      var host = DS.$('[data-hero-card]');
      if (!host) return;
      var p = heroProduct();
      if (!p) { host.style.display = 'none'; return; }
      var tn = storeOf(p);
      host.setAttribute('aria-label', EN ? 'Featured product' : 'منتج مميز');
      host.innerHTML =
        '<div class="bz-float-inner">' +
          '<img src="' + esc(imgOf(p)) + '" alt="' + esc(pname(p)) + '" ' +
            'onerror="this.onerror=null;this.src=\'' + esc(url('assets/product-placeholder.svg')) + '\'">' +
          '<div class="bz-float-info">' +
            '<span class="bz-float-store">' + esc(tname(tn)) + '</span>' +
            '<b>' + esc(pname(p)) + '</b>' +
            '<span class="bz-float-price">' + money(p.price) + '</span>' +
          '</div>' +
          '<button type="button" class="bz-float-add" data-add="' + esc(p.id) + '" aria-label="' + esc(L.add) + '">' + icon('plus') + '</button>' +
        '</div>' +
        '<span class="bz-float-note"><i></i>' + esc(L.floatNote) + '</span>';
      bindAddButtons(host);
      renderCart();
    }

    /* ─────────────────────────── STORE RAIL ───────────────────────── */
    function renderStores() {
      var host = DS.$('[data-stores]');
      if (!host) return;
      var list = tenants();
      host.innerHTML =
        '<button type="button" class="bz-storebtn' + (!state.store ? ' is-on' : '') + '" data-store-filter="">' +
          '<span class="bz-store-initial">' + icon('grid') + '</span>' +
          '<span>' + esc(L.allStores) + '</span>' +
          '<span class="bz-store-count">' + allProducts().length + '</span>' +
        '</button>' +
        list.map(function (tn) {
          return '<button type="button" class="bz-storebtn' + (state.store === tn.id ? ' is-on' : '') + '" data-store-filter="' + esc(tn.id) + '">' +
            '<span class="bz-store-initial">' + esc(initial(tname(tn))) + '</span>' +
            '<span>' + esc(tname(tn)) + '</span>' +
            '<span class="bz-store-count">' + productCount(tn.id) + '</span>' +
          '</button>';
        }).join('');

      DS.$$('[data-store-filter]', host).forEach(function (b) {
        b.addEventListener('click', function () {
          state.store = b.getAttribute('data-store-filter');
          renderStores();
          renderGrid();
        });
      });
    }

    /* ──────────────────────────── CHIPS ───────────────────────────── */
    function categories() {
      var out = [];
      allProducts().forEach(function (p) {
        var c = pcat(p);
        if (c && out.indexOf(c) === -1) out.push(c);
      });
      return out;
    }

    function renderChips() {
      var host = DS.$('[data-chips]');
      if (!host) return;
      host.innerHTML =
        '<button type="button" class="bz-chip' + (!state.cat ? ' is-on' : '') + '" data-cat="">' + esc(L.all) + '</button>' +
        categories().map(function (c) {
          return '<button type="button" class="bz-chip' + (state.cat === c ? ' is-on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
        }).join('');
      DS.$$('[data-cat]', host).forEach(function (b) {
        b.addEventListener('click', function () {
          state.cat = b.getAttribute('data-cat');
          renderChips();
          renderGrid();
        });
      });
    }

    /* ──────────────────────────── PRODUCTS ────────────────────────── */
    function visibleProducts() {
      var q = state.q.trim().toLowerCase();
      return allProducts().filter(function (p) {
        if (state.store && p.tenant_id !== state.store) return false;
        if (state.cat && pcat(p) !== state.cat) return false;
        if (!q) return true;
        var tn = storeOf(p);
        var hay = [p.name, p.name_en, p.category, p.category_en, p.sku, p.barcode,
          tn ? tn.name : '', tn ? tn.name_en : ''].join(' ').toLowerCase();
        return hay.indexOf(q) > -1;
      });
    }

    function badgeMarkup(p, tn) {
      var offline = !storeOpen(tn);
      var out = (Number(p.stock) || 0) <= 0;
      if (offline) return '<span class="bz-badge is-dark">' + esc(L.offline) + '</span>';
      if (out) return '<span class="bz-badge is-dark">' + esc(L.out) + '</span>';
      if ((p.sold || 0) >= 300) return '<span class="bz-badge is-lime">' + esc(L.best) + '</span>';
      if ((p.rating || 0) >= 4.9) return '<span class="bz-badge">' + esc(L.featured) + '</span>';
      return '';
    }

    function cardMarkup(p) {
      var tn = storeOf(p);
      var offline = tn ? !storeOpen(tn) : true;
      var out = (Number(p.stock) || 0) <= 0;
      var disabled = offline || out;
      var line = lineOf(p.id);
      return '<article class="bz-card' + (disabled ? ' is-out' : '') + '">' +
        '<div class="bz-media">' +
          '<img src="' + esc(imgOf(p)) + '" alt="' + esc(pname(p)) + '" loading="lazy" ' +
            'onerror="this.onerror=null;this.src=\'' + esc(url('assets/product-placeholder.svg')) + '\'">' +
          badgeMarkup(p, tn) +
        '</div>' +
        '<div class="bz-body">' +
          '<h3 class="bz-name">' + esc(pname(p)) + '</h3>' +
          '<span class="bz-store">' + esc(tname(tn)) + '</span>' +
          '<div class="bz-foot">' +
            '<span class="bz-price">' + money(p.price) + '</span>' +
            '<button type="button" class="bz-add' + (line ? ' is-in' : '') + '" data-add="' + esc(p.id) + '"' +
              (disabled ? ' disabled' : '') + ' aria-label="' + esc(L.add) + '" title="' +
              esc(offline ? (EN ? 'Store is offline' : 'المتجر أوفلاين الآن') : L.add) + '">' +
              (line ? '<b>' + line.qty + '</b>' : icon('plus')) +
            '</button>' +
          '</div>' +
        '</div>' +
      '</article>';
    }

    function renderGrid() {
      var host = DS.$('[data-grid]');
      if (!host) return;
      var shown = visibleProducts();
      var vendors = [];
      shown.forEach(function (p) { if (vendors.indexOf(p.tenant_id) === -1) vendors.push(p.tenant_id); });

      var countEl = DS.$('[data-count-line]');
      if (countEl) {
        countEl.innerHTML = state.q.trim()
          ? '<b>' + shown.length + '</b> ' + esc(L.products) + ' · “' + esc(state.q.trim()) + '”'
          : '<b>' + shown.length + '</b> ' + esc(L.products) + ' · <b>' + vendors.length + '</b> ' + esc(L.storesWord);
      }

      if (!shown.length) {
        host.innerHTML = '<div class="bz-empty">' + icon('search') +
          '<b>' + esc(EN ? 'No matching products' : 'لا توجد منتجات مطابقة') + '</b>' +
          '<span>' + esc(EN ? 'Try another search or pick a different store.' : 'جرّب كلمة بحث أخرى أو اختر متجراً مختلفاً.') + '</span></div>';
        return;
      }

      host.innerHTML = shown.map(cardMarkup).join('');
      bindAddButtons(host);
      renderCart();
    }

    /* ────────────────────────── CART DRAWER ───────────────────────── */
    function bagSubtitle() {
      var count = cartCount();
      var n = groups().length;
      if (!count || !n) return EN ? 'Nothing here yet' : 'لا يوجد شيء بعد';
      if (n > 1) return (EN ? count + ' items · ' + n + ' stores' : count + ' ' + L.products + ' · ' + n + ' ' + L.storesPlural);
      return (EN ? count + ' items · ' + tname(groups()[0].tenant) : count + ' ' + L.products + ' · ' + tname(groups()[0].tenant));
    }

    function lineMarkup(l) {
      var name = EN ? (l.name_en || l.name) : (l.name || l.name_en);
      return '<div class="bz-line">' +
        '<img class="bz-line-img" src="' + esc(DS.data.img(l.image)) + '" alt="" ' +
          'onerror="this.onerror=null;this.src=\'' + esc(url('assets/product-placeholder.svg')) + '\'">' +
        '<div class="bz-line-info">' +
          '<b>' + esc(name) + '</b>' +
          '<span>' + money(l.price) + '</span>' +
          '<div class="bz-qty">' +
            '<button type="button" data-qty-minus="' + esc(l.id) + '" aria-label="minus">' + icon('minus') + '</button>' +
            '<i>' + l.qty + '</i>' +
            '<button type="button" data-qty-plus="' + esc(l.id) + '" aria-label="plus">' + icon('plus') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="bz-line-end">' +
          '<b>' + money((Number(l.price) || 0) * (Number(l.qty) || 0)) + '</b>' +
          '<button type="button" class="bz-line-x" data-qty-remove="' + esc(l.id) + '" aria-label="' + esc(L.remove) + '">' + icon('x') + '</button>' +
        '</div>' +
      '</div>';
    }

    function vendorMarkup(g) {
      var open = storeOpen(g.tenant);
      return '<section class="bz-vgroup">' +
        '<div class="bz-vhead">' +
          '<span class="bz-vlogo">' + esc(initial(tname(g.tenant))) + '</span>' +
          '<span class="bz-vname"><b>' + esc(tname(g.tenant)) + '</b>' +
            '<span>' + esc(open ? (EN ? 'Open now' : 'مفتوح الآن') : L.offline) + '</span></span>' +
          '<span class="bz-vfee">' + esc(L.delivery) + ' ' + money(vendorFee(g.tenant.id)) + '</span>' +
        '</div>' +
        g.items.map(lineMarkup).join('') +
      '</section>';
    }

    function renderDrawer() {
      var bodyEl = DS.$('[data-bag-body]');
      var footEl = DS.$('[data-bag-foot]');
      var subEl = DS.$('[data-bag-sub]');
      if (!bodyEl || !footEl) return;

      if (subEl) subEl.textContent = bagSubtitle();

      if (!cart.items.length) {
        bodyEl.innerHTML = '<div class="bz-bag-empty">' + icon('bag') +
          '<b>' + esc(L.bagEmpty) + '</b>' +
          '<span>' + esc(L.bagEmptyText) + '</span>' +
          '<button type="button" data-browse>' + esc(L.browse) + '</button></div>';
        footEl.innerHTML = '';
        return;
      }

      var closed = closedVendors();
      bodyEl.innerHTML = groups().map(vendorMarkup).join('') +
        (closed.length
          ? '<div class="bz-warn">' + icon('alert') +
            '<span>' + esc(L.closedWarn) + esc(closed.join('، ')) + esc(L.closedWarnEnd) + '</span></div>'
          : '');

      var fee = deliveryFee();
      var blocked = closed.length > 0;
      footEl.innerHTML =
        '<div class="bz-sum"><span>' + esc(L.subtotal) + '</span><b>' + money(cartTotal()) + '</b></div>' +
        '<div class="bz-sum"><span>' + esc(L.delivery) + ' (' + groups().length + ')</span><b>' + money(fee) + '</b></div>' +
        '<div class="bz-sum bz-total"><span>' + esc(L.total) + '</span><b>' + money(cartTotal() + fee) + '</b></div>' +
        '<button type="button" class="bz-checkout" data-checkout' + (blocked ? ' disabled' : '') + '>' +
          esc(L.checkout) + icon('arrowRight') + '</button>' +
        '<p class="bz-secure">' + icon('shield') + esc(L.secure) + '</p>' +
        '<p class="bz-fee-note">' + esc(EN ? 'Delivery is charged once per store.' : 'رسوم التوصيل تُحسب لكل متجر على حدة.') + '</p>';
    }

    function openDrawer() {
      renderDrawer();
      document.body.classList.add('bz-drawer-open');
      var drawer = DS.$('[data-drawer]');
      if (drawer) drawer.setAttribute('aria-hidden', 'false');
      var close = DS.$('[data-close-drawer]');
      if (close) setTimeout(function () { close.focus(); }, 80);
    }
    function closeDrawer() {
      document.body.classList.remove('bz-drawer-open');
      var drawer = DS.$('[data-drawer]');
      if (drawer) drawer.setAttribute('aria-hidden', 'true');
    }

    DS.$$('[data-open-drawer]').forEach(function (b) {
      b.addEventListener('click', function (e) { e.preventDefault(); openDrawer(); });
    });
    var closeBtn = DS.$('[data-close-drawer]');
    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    var scrim = DS.$('[data-scrim]');
    if (scrim) scrim.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.body.classList.contains('bz-drawer-open')) closeDrawer();
    });

    /* Drawer interactions (delegated so re-renders never lose handlers). */
    var bagBody = DS.$('[data-bag-body]');
    if (bagBody) {
      bagBody.addEventListener('click', function (e) {
        var t = e.target;
        if (t.closest('[data-browse]')) { closeDrawer(); return; }
        var plus = t.closest('[data-qty-plus]');
        if (plus) { var lp = lineOf(plus.getAttribute('data-qty-plus')); if (lp) setQty(lp.id, (Number(lp.qty) || 0) + 1); return; }
        var minus = t.closest('[data-qty-minus]');
        if (minus) { var lm = lineOf(minus.getAttribute('data-qty-minus')); if (lm) setQty(lm.id, (Number(lm.qty) || 0) - 1); return; }
        var remove = t.closest('[data-qty-remove]');
        if (remove) { setQty(remove.getAttribute('data-qty-remove'), 0); }
      });
    }

    var bagFoot = DS.$('[data-bag-foot]');
    if (bagFoot) {
      bagFoot.addEventListener('click', function (e) {
        var go = e.target.closest('[data-checkout]');
        if (!go || go.disabled) return;
        if (!cart.items.length) return;
        if (closedVendors().length) {
          DS.toast(EN ? 'Remove offline store items first.' : 'احذف منتجات المتجر الأوفلاين أولاً.', 'error');
          return;
        }
        location.href = url('customer/checkout.html');
      });
    }

    /* ─────────────────────────── SEARCH ───────────────────────────── */
    if (searchEl) {
      searchEl.addEventListener('input', DS.debounce(function () {
        state.q = searchEl.value;
        renderGrid();
      }, 150));
    }

    /* ──────────────────────── NAV / SCROLL ────────────────────────── */
    var nav = DS.$('.bz-nav');
    function onScroll() {
      if (!nav) return;
      nav.classList.toggle('is-stuck', window.scrollY > 8);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    /* ──────────────────────────── BOOT ────────────────────────────── */
    renderStores();
    renderChips();
    renderGrid();
    renderHeroCard();
    renderCart();

    /* ─────────────────── HARDWARE BARCODE SCANNER ─────────────────── */
    if (DS.mountBarcodeScanner) {
      DS.mountBarcodeScanner({
        getProducts: function () { return allProducts(); },
        onFound: function (p) {
          var tn = storeOf(p);
          if (tn && !storeOpen(tn)) {
            DS.toast(EN ? tname(tn) + ' is offline right now.' : 'متجر ' + tname(tn) + ' أوفلاين حالياً.', 'error');
            return;
          }
          if (addToCart(p.id, true)) {
            DS.toast(pname(p) + ' · ' + L.scanOk, 'success');
          }
        },
        onNotFound: function () {
          DS.toast(L.scanNo, 'error');
        }
      });
    }
  })();
  </script>
</body>
</html>
