  <script>
    (function () {
      var theme = 'light';
      try { var t = localStorage.getItem('ds_customer_theme'); if (t === 'dark' || t === 'light') theme = t; } catch (e) {}
      document.documentElement.setAttribute('data-st-theme', theme);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', theme === 'dark' ? '#0b0b0b' : '#ffffff');
    })();
  </script>
