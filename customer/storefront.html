    /* Apply the saved customer theme before paint (no white flash). */
    (function () {
      try {
        var t = localStorage.getItem('ds_customer_theme');
        document.documentElement.setAttribute('data-customer-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-customer-theme', 'dark');
      }
    })();

  <script>
    /* Keeps the hero edge-to-edge by matching the shell's real content padding. */
    (function () {
      function sync() {
        var host = document.querySelector('.ds-content');
        if (!host) return;
        var cs = window.getComputedStyle(host);
        host.style.setProperty('--sf-bleed', cs.paddingLeft || '28px');
        host.style.setProperty('--sf-bleed-top', cs.paddingTop || '26px');
      }
      var raf = 0;
      function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(sync); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync);
      else sync();
      window.addEventListener('load', sync);
      window.addEventListener('resize', schedule);
    })();
  </script>

  <script>
    /* Giveaway banner: hidden when the visitor dismissed it or already
       registered through customer/win.html. Dismissal is remembered per
       browser, so it never nags a customer twice. */
    (function () {
      'use strict';
      var DISMISS_KEY = 'ds_giveaway_banner_dismissed';
      var box = document.getElementById('sfGiveaway');
      if (!box) return;

      var dismissed = false;
      try { dismissed = localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) {}
      if (dismissed) return;

      var closed = false;

      var leads = window.DSLeads;
      if (leads && typeof leads.submitted === 'function' && leads.submitted()) return;

      var link = document.getElementById('sfGiveawayLink');
      try {
        if (window.DS && DS.url) link.href = DS.url('customer/win.html');
      } catch (e) {}

      var EN = (document.documentElement.getAttribute('lang') || '').indexOf('en') === 0;
      if (EN) {
        document.getElementById('sfGiveawayTitle').textContent = 'Enter the giveaway and win a phone!';
        document.getElementById('sfGiveawaySub').textContent = 'DotStudio Kafr El-Sheikh draw — free entry';
        document.getElementById('sfGiveawayCta').textContent = 'Enter now';
        document.getElementById('sfGiveawayClose').setAttribute('aria-label', 'Close banner');
      }

      function close() {
        closed = true;
        box.hidden = true;
        try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
      }
      document.getElementById('sfGiveawayClose').addEventListener('click', function (e) {
        e.preventDefault();
        close();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !box.hidden) close();
      });

      setTimeout(function () {
        if (closed) return;
        box.hidden = false;
        requestAnimationFrame(function () { box.classList.add('is-in'); });
      }, 1600);
    })();
  </script>
